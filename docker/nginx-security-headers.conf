# Security headers of every response of the site and the backend, error responses included (`always`).
# Include it in the server block and in every location that has its own `add_header` (an `add_header` in a
# location drops all inherited ones). Target on the server: /etc/nginx/snippets/security-headers.conf.
# HSTS is set by the TLS proxy, which sees the real HTTPS.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
